<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Guestbook — Jorjis Hasan</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <meta name="description" content="An open page." />
    <link rel="stylesheet" href="guestbook.css" />
  </head>
  <body>
    <nav class="nav">
      <a href="../">home</a>
      <div class="nav__modes">
        <button type="button" data-mode="write" class="is-active">write</button>
        <button type="button" data-mode="draw">draw</button>
      </div>
      <button type="button" id="clear" class="nav__clear" hidden>clear</button>
    </nav>

    <div
      id="write"
      class="write"
      contenteditable="true"
      role="textbox"
      aria-label="Write"
      data-placeholder="Begin anywhere."
      spellcheck="true"
    ></div>

    <canvas id="draw" class="draw" hidden aria-label="Draw"></canvas>

    <script src="guestbook.js"></script>
  </body>
</html>
