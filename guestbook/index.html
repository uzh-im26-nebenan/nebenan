<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Guestbook — Jorjis Hasan</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A private guestbook. Notes stay on your device."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Sans:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="guestbook.css" />
  </head>
  <body>
    <a class="skip" href="#note">Skip to write a note</a>

    <div class="page">
      <header class="head">
        <a href="../">home</a>
        <time class="now" id="now" datetime=""></time>
      </header>

      <main>
        <section class="intro">
          <p class="intro__kicker">guestbook</p>
          <h1>Leave a line.</h1>
        </section>

        <section class="compose" aria-label="Write a note">
          <label class="sr-only" for="note">Your note</label>
          <textarea
            id="note"
            rows="2"
            maxlength="160"
            placeholder="One quiet sentence…"
          ></textarea>
          <div class="compose__row">
            <span class="compose__count" id="count" aria-live="polite">160</span>
            <button type="button" id="add">Add</button>
          </div>
          <p class="compose__error" id="error" hidden></p>
        </section>

        <section class="book" aria-label="Notes">
          <ol class="list" id="list"></ol>
          <p class="empty" id="empty">Still empty.</p>
        </section>
      </main>
    </div>

    <script src="guestbook.js"></script>
  </body>
</html>
