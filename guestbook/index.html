<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Guestbook — Jorjis Hasan</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Leave a note." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=IBM+Plex+Sans:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="guestbook.css" />
  </head>
  <body>
    <div class="page">
      <header class="top">
        <a class="top__home" href="../">home</a>
        <p class="top__mark">guestbook</p>
      </header>

      <main class="main">
        <section class="intro" aria-labelledby="gb-title">
          <h1 id="gb-title">A quiet book of notes.</h1>
          <p>Write a line. Leave a mark. Nothing more is required.</p>
        </section>

        <section class="compose" aria-label="Leave a note">
          <label class="field">
            <span class="field__label">From</span>
            <input
              id="name"
              type="text"
              maxlength="40"
              autocomplete="nickname"
              placeholder="Anonymous"
            />
          </label>

          <label class="field">
            <span class="field__label">Note</span>
            <textarea
              id="note"
              rows="3"
              maxlength="280"
              placeholder="A sentence is enough."
            ></textarea>
          </label>

          <div class="sign">
            <div class="sign__bar">
              <span class="field__label">Mark</span>
              <button type="button" class="text-btn" id="clear-mark">
                clear
              </button>
            </div>
            <div class="sign__pad" id="pad">
              <canvas id="pen" aria-label="Draw a mark"></canvas>
              <p class="sign__hint" id="hint">draw here</p>
            </div>
          </div>

          <div class="compose__actions">
            <button type="button" class="submit" id="submit">Leave note</button>
            <p class="compose__error" id="error" hidden></p>
          </div>
        </section>

        <section class="entries" aria-label="Notes">
          <div class="entries__head">
            <h2>Notes</h2>
            <span id="count" class="entries__count"></span>
          </div>
          <div id="list" class="list"></div>
          <p id="empty" class="empty">Still empty. Be the first.</p>
        </section>
      </main>
    </div>
    <script src="guestbook.js"></script>
  </body>
</html>
