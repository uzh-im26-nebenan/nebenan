<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Guestbook — Jorjis Hasan</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <meta name="description" content="Leave a mark in ink." />
    <link rel="stylesheet" href="guestbook.css" />
  </head>
  <body>
    <div class="app">
      <header class="bar">
        <a href="../">home</a>
        <p class="bar__hint">draw to leave a mark · scroll to move</p>
      </header>

      <canvas id="page" aria-label="Ink guestbook"></canvas>

      <aside class="zoom" aria-label="Zoom">
        <button type="button" id="zoom-in">+</button>
        <button type="button" id="zoom-out">−</button>
      </aside>
    </div>
    <script src="guestbook.js"></script>
  </body>
</html>
